sentence=Complete Telegram bot library for ESP32 with LTE failover, OTA updates, and advanced power management.
paragraph=Robust Telegram bot for ESP32 that never loses messages. Features automatic WiFi/LTE failover (Quectel/SIMCOM), persistent message queuing with LittleFS and 4-level priority system, secure OTA updates via Telegram, NTP sync, SSL/TLS, multi-language support (7 languages), and intelligent power management. Zero-copy char[] buffers prevent memory leaks. Custom JSON parser with no external dependencies. Ideal for remote IoT devices requiring 100% reliable messaging with cellular backup.
category=Communication
url=https://github.com/victek/KissTelegram
architectures=esp32
includes=KissTelegram.h,KissLTE.h,KissOTA.h,KissSSL.h