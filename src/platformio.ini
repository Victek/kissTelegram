# ============================================================================
# PlatformIO Configuration for KissTelegram
# ESP32-S3 with 16MB Flash / 8MB PSRAM
# Board: 4D Systems gen4-ESP32-S3 (or compatible)
# ============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

# ============================================================================
# FLASH & PSRAM Configuration
# ============================================================================
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.memory_type = qio_opi

# Custom partition table (13MB SPIFFS!)
board_build.partitions = partitions.csv

# ============================================================================
# Upload Configuration
# ============================================================================
upload_speed = 921600
monitor_speed = 115200

# Upload port (ajustar según tu sistema)
# Windows: upload_port = COM3
# Linux: upload_port = /dev/ttyUSB0
# Mac: upload_port = /dev/cu.usbserial-*

# Si tienes problemas de upload, descomenta y prueba:
# upload_protocol = esptool
# upload_flags = 
#     --before=default_reset
#     --after=hard_reset
#     --chip=esp32s3

# ============================================================================
# Build Flags
# ============================================================================
build_flags =
    # ESP32-S3 specific
    -DARDUINO_ESP32S3_DEV
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    
    # Optimize for performance
    -O2
    
    # Enable exceptions (necesario para algunas libs)
    -fexceptions
    
    # Stack size (ajustar si es necesario)
    -DESP_TASK_MAIN_STACK=8192
    
    # Habilitar soporte WiFi
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_USE_WDT=0

# ============================================================================
# Library Dependencies
# ============================================================================
lib_deps =
    # WiFi y networking (incluidos en ESP32 core)
    # KissTelegram (local)
    
# Si KissTelegram está en GitHub:
# lib_deps =
#     https://github.com/victek/KissTelegram.git

# ============================================================================
# Monitor Configuration
# ============================================================================
monitor_filters = 
    esp32_exception_decoder
    time
    colorize

# ============================================================================
# NOTAS IMPORTANTES
# ============================================================================
#
# 1. PRIMERA SUBIDA (fresh ESP32-S3):
#    - Coloca partitions.csv en raíz del proyecto
#    - pio run -t erase (borra flash completo)
#    - pio run -t upload (sube firmware + particiones)
#
# 2. MODO BOOT (si falla upload):
#    - Mantén BOOT presionado
#    - Pulsa RESET
#    - Suelta RESET
#    - Suelta BOOT
#    - pio run -t upload
#
# 3. VERIFICAR PARTICIONES:
#    - Después de primer upload exitoso
#    - Monitor serial debe mostrar 13MB SPIFFS disponible
#
# 4. OTA UPDATES:
#    - Después de primera subida, OTA funcionará normalmente
#    - app0 y app1 alternan automáticamente
#
# ============================================================================