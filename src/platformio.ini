; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries

; Configuración del chip específico
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Tamaños de memoria para N16R8 (16MB Flash + 8MB PSRAM)
board_build.flash_size = 16MB
board_build.psram_type = opi

; 🎯 PARTICIÓN PERSONALIZADA DE 12MB
board_build.partitions = partitions.csv

; 🎯 Tamaño máximo sketch = 12MB (según tu factory partition)
board_upload.maximum_size = 12582912

; Habilitar PSRAM
board_build.arduino.memory_type = opi_opi
build_flags = 
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DCONFIG_SPIRAM_SPEED_80M=1
    -DCONFIG_ESP32_ENABLE_COREDUMP_TO_NONE=1
    -mfix-esp32-psram-cache-issue

; Configuración del monitor serie
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

